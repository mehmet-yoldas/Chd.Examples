services:
  postgres:
    image: postgres:16
    container_name: chd-workflow-sample-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chd_workflow_sample
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chd_workflow_sample"]
      interval: 2s
      timeout: 5s
      retries: 30
